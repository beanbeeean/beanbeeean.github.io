<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Witch Chronicle 핵심 게임 루프</title>
  <desc id="desc">거점, 성장, 던전 탐험, 턴제 전투, 결과와 복귀로 이어지는 순환 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="0.52" stop-color="#F8F6FF"/>
      <stop offset="1" stop-color="#FFF9F2"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E8FAF2"/><stop offset="1" stop-color="#DDF4EC"/></linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF7DA"/><stop offset="1" stop-color="#FDEDC6"/></linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9F4FF"/><stop offset="1" stop-color="#DAEAFD"/></linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0EAFF"/><stop offset="1" stop-color="#E4D9FA"/></linearGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFEDEB"/><stop offset="1" stop-color="#F9DFDC"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#667085" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8290A8"/>
    </marker>
    <style>
      .font { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; }
      .title { font-size: 45px; font-weight: 800; fill: #27314A; letter-spacing: -1px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #748096; }
      .step { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; }
      .card-title { font-size: 29px; font-weight: 800; fill: #27314A; }
      .body { font-size: 18px; font-weight: 550; fill: #596579; }
      .chip { font-size: 15px; font-weight: 700; fill: #556074; }
      .arrow-label { font-size: 14px; font-weight: 700; fill: #7A879C; letter-spacing: .4px; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="130" cy="100" r="92" fill="#DDF6ED" opacity="0.55"/>
  <circle cx="1510" cy="85" r="120" fill="#E7E0FA" opacity="0.55"/>
  <circle cx="1515" cy="815" r="150" fill="#F9E7D7" opacity="0.45"/>
  <path d="M210 156 C420 88, 1130 88, 1388 165" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.78"/>

  <g class="font">
    <text x="800" y="105" text-anchor="middle" class="title">Witch Chronicle</text>
    <text x="800" y="143" text-anchor="middle" class="subtitle">핵심 게임 플레이 루프</text>
    <rect x="650" y="169" width="300" height="34" rx="17" fill="#FFFFFF" opacity="0.82"/>
    <text x="800" y="192" text-anchor="middle" class="chip">거점에서 성장하고, 탐험과 전투를 반복한다</text>

    <!-- Flow arrows -->
    <g fill="none" stroke="#8290A8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M315 430 H359"/>
      <path d="M620 430 H664"/>
      <path d="M925 430 H969"/>
      <path d="M1230 430 H1274"/>
      <path d="M1410 615 V710 C1410 748 1375 770 1337 770 H262 C224 770 190 748 190 710 V626"/>
    </g>
    <text x="337" y="411" text-anchor="middle" class="arrow-label">준비</text>
    <text x="642" y="411" text-anchor="middle" class="arrow-label">출발</text>
    <text x="947" y="411" text-anchor="middle" class="arrow-label">조우</text>
    <text x="1252" y="411" text-anchor="middle" class="arrow-label">결과</text>
    <rect x="672" y="750" width="256" height="40" rx="20" fill="#FFFFFF" stroke="#D9DEE8"/>
    <text x="800" y="776" text-anchor="middle" class="chip">보상 · 재정비 · 다음 모험</text>

    <!-- Card 1 -->
    <g filter="url(#shadow)">
      <rect x="65" y="270" width="250" height="345" rx="28" fill="url(#card1)" stroke="#B9E6D4" stroke-width="2"/>
      <circle cx="112" cy="319" r="25" fill="#FFFFFF"/>
      <text x="112" y="326" text-anchor="middle" class="step" fill="#3E9B78">01</text>
      <text x="190" y="329" text-anchor="middle" class="card-title">거점</text>
      <line x1="91" y1="360" x2="289" y2="360" stroke="#B9E6D4"/>
      <text x="92" y="407" class="body">채집 · 낚시 · 요리</text>
      <text x="92" y="447" class="body">퀘스트 수주</text>
      <text x="92" y="487" class="body">아군 캐릭터 영입</text>
      <rect x="91" y="530" width="162" height="38" rx="19" fill="#FFFFFF" opacity="0.86"/>
      <text x="172" y="555" text-anchor="middle" class="chip">생활 · 힐링 · 수집</text>
    </g>

    <!-- Card 2 -->
    <g filter="url(#shadow)">
      <rect x="370" y="270" width="250" height="345" rx="28" fill="url(#card2)" stroke="#F0D997" stroke-width="2"/>
      <circle cx="417" cy="319" r="25" fill="#FFFFFF"/>
      <text x="417" y="326" text-anchor="middle" class="step" fill="#B78924">02</text>
      <text x="495" y="329" text-anchor="middle" class="card-title">성장</text>
      <line x1="396" y1="360" x2="594" y2="360" stroke="#F0D997"/>
      <text x="397" y="407" class="body">장비 · 스탯 · 강화</text>
      <text x="397" y="447" class="body">상점 이용</text>
      <text x="397" y="487" class="body">가챠 · 스킬 구성</text>
      <rect x="396" y="530" width="163" height="38" rx="19" fill="#FFFFFF" opacity="0.86"/>
      <text x="478" y="555" text-anchor="middle" class="chip">파티 빌드 완성</text>
    </g>

    <!-- Card 3 -->
    <g filter="url(#shadow)">
      <rect x="675" y="270" width="250" height="345" rx="28" fill="url(#card3)" stroke="#B9D6F3" stroke-width="2"/>
      <circle cx="722" cy="319" r="25" fill="#FFFFFF"/>
      <text x="722" y="326" text-anchor="middle" class="step" fill="#4287C2">03</text>
      <text x="807" y="329" text-anchor="middle" class="card-title">던전 탐험</text>
      <line x1="701" y1="360" x2="899" y2="360" stroke="#B9D6F3"/>
      <text x="702" y="407" class="body">랜덤 방 배치</text>
      <text x="702" y="447" class="body">함정 · 버프 · 상점</text>
      <text x="702" y="487" class="body">몬스터 조우</text>
      <rect x="701" y="530" width="170" height="38" rx="19" fill="#FFFFFF" opacity="0.86"/>
      <text x="786" y="555" text-anchor="middle" class="chip">선제 공격 시 선공</text>
    </g>

    <!-- Card 4 -->
    <g filter="url(#shadow)">
      <rect x="980" y="270" width="250" height="345" rx="28" fill="url(#card4)" stroke="#CBBCEB" stroke-width="2"/>
      <circle cx="1027" cy="319" r="25" fill="#FFFFFF"/>
      <text x="1027" y="326" text-anchor="middle" class="step" fill="#7455AD">04</text>
      <text x="1110" y="329" text-anchor="middle" class="card-title">턴제 전투</text>
      <line x1="1006" y1="360" x2="1204" y2="360" stroke="#CBBCEB"/>
      <text x="1007" y="407" class="body">선공 Phase</text>
      <text x="1007" y="447" class="body">속도 기반 턴 순서</text>
      <text x="1007" y="487" class="body">마법진 스킬 판정</text>
      <rect x="1006" y="530" width="166" height="38" rx="19" fill="#FFFFFF" opacity="0.86"/>
      <text x="1089" y="555" text-anchor="middle" class="chip">전략적 턴 운영</text>
    </g>

    <!-- Card 5 -->
    <g filter="url(#shadow)">
      <rect x="1285" y="270" width="250" height="345" rx="28" fill="url(#card5)" stroke="#EDC1BC" stroke-width="2"/>
      <circle cx="1332" cy="319" r="25" fill="#FFFFFF"/>
      <text x="1332" y="326" text-anchor="middle" class="step" fill="#B75C52">05</text>
      <text x="1444" y="329" text-anchor="middle" class="card-title">결과 · 복귀</text>
      <line x1="1311" y1="360" x2="1509" y2="360" stroke="#EDC1BC"/>
      <text x="1312" y="407" class="body">승리 → 던전 복귀</text>
      <text x="1312" y="447" class="body">패배 → 거점 부활</text>
      <text x="1312" y="487" class="body">포탈 → 거점 귀환</text>
      <rect x="1311" y="530" width="168" height="38" rx="19" fill="#FFFFFF" opacity="0.86"/>
      <text x="1395" y="555" text-anchor="middle" class="chip">보상 후 성장 반복</text>
    </g>
  </g>
</svg>

